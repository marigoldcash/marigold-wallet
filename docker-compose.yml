# Marigold wallet.
#
#   docker compose run --rm wallet
#
# `run`, not `up`: the wallet is an interactive terminal program, not a service.
services:
  wallet:
    # The released binary is built for x86-64 Linux. Without this line Docker
    # on an Apple Silicon Mac builds an arm64 image, drops an amd64 binary into
    # it, and the container dies with "exec format error" before the wallet
    # prints anything. Pinning the platform makes Docker run the amd64 image
    # under emulation instead, which works everywhere at some cost in speed —
    # noticeable only if you run the wallet's own node.
    platform: linux/amd64
    build:
      # Builds straight from this repository — no clone needed.
      context: https://github.com/marigoldcash/marigold-wallet.git
    image: marigold-wallet:latest
    # The wallet runs as whoever owns the folder below on your machine, so the
    # files stay yours — on Linux and on a Mac, whatever your account's uid.
    # To pick a different account: MARIGOLD_UID=$(id -u) MARIGOLD_GID=$(id -g) docker compose run --rm wallet
    environment:
      MARIGOLD_UID: ${MARIGOLD_UID:-}
      MARIGOLD_GID: ${MARIGOLD_GID:-}
    # The same ~/.marigold the native wallet uses, so there is one set of keys
    # on this machine rather than two. This used to be a named Docker volume
    # living under /var/lib/docker/volumes/, where nobody would think to look
    # and nobody would think to back up.
    #
    # Sharing is safe: the wallet takes an exclusive lock on the file it opens,
    # and that lock is held in the kernel on the real inode — so a wallet open
    # in the container refuses to open on the host, and the other way round.
    volumes:
      - ${HOME}/.marigold:/data/.marigold
      # This file, read-only, so the container can see who you are: when the
      # folder above does not exist yet, Docker creates it as root, and the
      # wallet then hands it to the owner of this file — you — rather than
      # guessing. Nothing is read from it.
      - ./docker-compose.yml:/run/marigold/owner:ro
    stdin_open: true
    tty: true
    # Only needed if you run the wallet's own node ('node start'). Without it
    # the node still works but cannot accept incoming peer connections.
    ports:
      - "26211:26211"

  # The miner as a service: no wallet, no terminal. Give it an address from
  # 'address' in your wallet and a share of the machine, then
  #
  #   docker compose up -d miner
  #   docker compose logs -f miner
  #
  # A wallet run afterwards ('docker compose run --rm wallet', then 'connect')
  # finds the miner's copy of the network and steers the miner with 'mine
  # start', 'mine stop' and 'mine status'. Both containers share
  # ~/.marigold, which is what makes that work.
  miner:
    platform: linux/amd64
    build:
      context: https://github.com/marigoldcash/marigold-wallet.git
    image: marigold-wallet:latest
    environment:
      MARIGOLD_UID: ${MARIGOLD_UID:-}
      MARIGOLD_GID: ${MARIGOLD_GID:-}
    volumes:
      - ${HOME}/.marigold:/data/.marigold
      - ./docker-compose.yml:/run/marigold/owner:ro
    # The miner's RPC is bound to 127.0.0.1 inside the container. network_mode
    # host puts the container on the machine's own loopback, so a wallet on
    # the host — native or in its own container with the same setting — can
    # reach it, and the node's p2p port 26211 is open to peers without a port
    # mapping.
    network_mode: host
    # MARIGOLD_MINE_TO is the address the rewards go to; without it the miner
    # refuses the placeholder and says so.
    command: ["mine-to", "${MARIGOLD_MINE_TO:-marigoldtest:REPLACE_WITH_YOUR_ADDRESS}", "${MARIGOLD_MINE_CPU:-50}"]
    restart: unless-stopped
    stop_grace_period: 90s
    profiles: ["miner"]
