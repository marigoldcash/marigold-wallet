# Marigold wallet.
#
#   docker compose run --rm wallet
#
# `run`, not `up`: the wallet is an interactive terminal program, not a service.
services:
  wallet:
    # The released binary is built for x86-64 Linux. Without this line Docker
    # on an Apple Silicon Mac builds an arm64 image, drops an amd64 binary into
    # it, and the container dies with "exec format error" before the wallet
    # prints anything. Pinning the platform makes Docker run the amd64 image
    # under emulation instead, which works everywhere at some cost in speed —
    # noticeable only if you run the wallet's own node.
    platform: linux/amd64
    build:
      # Builds straight from this repository — no clone needed.
      context: https://github.com/marigoldcash/marigold_docker.git
    image: marigold-wallet:latest
    # Run as you, not as the image's own user, so the folder below stays
    # readable and writable from your desktop. Override if your account is not
    # 1000: MARIGOLD_UID=$(id -u) MARIGOLD_GID=$(id -g) docker compose run --rm wallet
    user: "${MARIGOLD_UID:-1000}:${MARIGOLD_GID:-1000}"
    # The same ~/.marigold the native wallet uses, so there is one set of keys
    # on this machine rather than two. This used to be a named Docker volume
    # living under /var/lib/docker/volumes/, where nobody would think to look
    # and nobody would think to back up.
    #
    # Sharing is safe: the wallet takes an exclusive lock on the file it opens,
    # and that lock is held in the kernel on the real inode — so a wallet open
    # in the container refuses to open on the host, and the other way round.
    volumes:
      - ${HOME}/.marigold:/data/.marigold
    stdin_open: true
    tty: true
    # Only needed if you run the wallet's own node ('node start'). Without it
    # the node still works but cannot accept incoming peer connections.
    ports:
      - "26211:26211"
